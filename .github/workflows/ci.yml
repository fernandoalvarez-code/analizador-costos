name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El build de Next ignora los errores de TypeScript (next.config.mjs), así
      # que este paso es el único lugar donde un error de tipos frena el deploy.
      - name: Typecheck
        run: npx tsc --noEmit

      # Valida la física de mecanizado contra los valores de catálogo Seco.
      # Es un script de tsx con su propia verificación (no usa vitest).
      - name: Test de física
        run: npx tsx src/lib/machining-physics.test.ts

      - name: Tests unitarios
        run: npm test

      # El emulador de Firestore necesita Java. Proyecto demo-*: nunca toca un
      # proyecto real (ver el script test:rules en package.json).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Tests de reglas de Firestore
        run: npm run test:rules
